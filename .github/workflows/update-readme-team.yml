name: Update README team layout

on:
  push:
    paths:
      - '.github/workflows/update-readme-team.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace team section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          start = '## **💡2. 팀원 소개(이름 기재 X)**'
          end = '## **💡3. 시스템 구성도**'

          if start not in text or end not in text:
              raise SystemExit('README team/system section markers not found')

          before, tail = text.split(start, 1)
          _, after = tail.split(end, 1)

          team = '''## **💡2. 팀원 소개(이름 기재 X)**

<table>
  <tr>
    <td align="center" width="25%"><img src="docs/images/team/mentee1.png" width="150" alt="멘티1"></td>
    <td align="center" width="25%"><img src="docs/images/team/mentee2.png" width="150" alt="멘티2"></td>
    <td align="center" width="25%"><img src="docs/images/team/mentee3.png" width="150" alt="멘티3"></td>
    <td align="center" width="25%"><img src="docs/images/team/mentor.png" width="150" alt="멘토"></td>
  </tr>
  <tr>
    <td align="center"><strong>멘티1</strong></td>
    <td align="center"><strong>멘티2</strong></td>
    <td align="center"><strong>멘티3</strong></td>
    <td align="center"><strong>멘토</strong></td>
  </tr>
  <tr>
    <td align="center">• AI / NLU<br>• 주문 데이터</td>
    <td align="center">• Robot / ROS2<br>• Vision</td>
    <td align="center">• App / Cloud / POS<br>• 개인화 서비스</td>
    <td align="center">• 프로젝트 멘토<br>• 기술 자문</td>
  </tr>
</table>

---

'''

          path.write_text(before + team + end + after, encoding='utf-8')
          PY

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "docs: format team introduction with image cards"
          git push
