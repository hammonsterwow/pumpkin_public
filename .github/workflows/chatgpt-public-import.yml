name: Import private main snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-public-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source snapshot
        run: |
          cat mirror_export/chunk_* > /tmp/pumpkin-main.b64
          base64 -d /tmp/pumpkin-main.b64 > /tmp/pumpkin-main.tar.gz
          echo "481ae3fd62db559bd52b230854ba0fc3d1f0f82cb65045cd96d4138b82a65831  /tmp/pumpkin-main.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pumpkin-source
          tar -xzf /tmp/pumpkin-main.tar.gz -C /tmp/pumpkin-source

      - name: Replace repository contents
        run: |
          cp .github/workflows/chatgpt-public-import.yml /tmp/chatgpt-public-import.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.github/workflows/' /tmp/pumpkin-source/ ./
          mkdir -p .github/workflows
          cp /tmp/chatgpt-public-import.yml .github/workflows/chatgpt-public-import.yml

      - name: Commit restored snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror yulllee0829/pumpkin main snapshot"
          git push origin HEAD:main
