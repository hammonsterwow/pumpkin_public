name: Generate TOD rule labels

on:
  push:
    branches:
      - feat/tod-rule-label-generator
    paths:
      - .github/workflows/generate_tod_rule_labels.yml
      - experiments/tod_slm/data_generation/generate_rule_labels.py
      - experiments/tod_slm/data_generation/build_multiturn_scenarios.py
      - experiments/tod_slm/data_generation/build_review_samples.py
      - experiments/tod_slm/data_generation/prepare_qwen_sft.py
      - experiments/tod_slm/review/app.py
      - experiments/tod_slm/review/index.html
      - scripts/run_tod_review_web.sh
      - ros2_ws/src/robot_controller/robot_controller/dialogue_act_resolver.py
      - ros2_ws/src/robot_controller/robot_controller/decision_node_additional_order.py
      - ros2_ws/src/robot_controller/robot_controller/menu_policy.py
      - ros2_ws/src/robot_controller/robot_controller/order_schema.py
      - ros2_ws/src/robot_controller/robot_controller/response_manager.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/tod-rule-label-generator
          fetch-depth: 0

      - name: Validate runtime command semantics
        run: |
          PYTHONPATH=ros2_ws/src/robot_controller python3 - <<'PY'
          from robot_controller.dialogue_act_resolver import DialogueActResolver

          resolver = DialogueActResolver()
          cases = {
              '주문 취소하고 다시 고를게요': 'RESTART',
              '취소하고 다시 주문할게요': 'RESTART',
              '처음부터 다시 주문할게요': 'RESTART',
              '새로 주문할게요': 'RESTART',
              '전부 취소할게요': 'CANCEL',
              '그럼 취소할게요': 'CANCEL',
              '주문 안 할게요': 'CANCEL',
          }
          for text, expected in cases.items():
              actual = resolver.resolve_command({'text': text})
              assert actual == expected, (text, expected, actual)
          print('runtime CANCEL/RESTART semantics OK')
          PY
          python3 -m py_compile \
            ros2_ws/src/robot_controller/robot_controller/dialogue_act_resolver.py \
            ros2_ws/src/robot_controller/robot_controller/decision_node_additional_order.py \
            ros2_ws/src/robot_controller/robot_controller/response_manager.py

      - name: Generate labels from canonical 24,019 rows
        run: |
          python3 experiments/tod_slm/data_generation/generate_rule_labels.py

      - name: Build deterministic multi-turn contexts
        run: |
          python3 experiments/tod_slm/data_generation/build_multiturn_scenarios.py

      - name: Build combined human review set
        run: |
          python3 experiments/tod_slm/data_generation/build_review_samples.py

      - name: Prepare leakage-safe Qwen SFT splits
        run: |
          python3 -m py_compile experiments/tod_slm/data_generation/prepare_qwen_sft.py
          python3 experiments/tod_slm/data_generation/prepare_qwen_sft.py

      - name: Validate reviewed scenario semantics
        run: |
          PYTHONPATH=ros2_ws/src/robot_controller python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from robot_controller.dialogue_act_resolver import DialogueActResolver

          multi_rows = [
              json.loads(line)
              for line in Path('data/tod/pumpkin_tod_v1_multiturn_review_sample.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          assert len(multi_rows) == 200, len(multi_rows)
          resolver = DialogueActResolver()

          affirm = [row for row in multi_rows if row.get('source_scenario') == 'affirm']
          deny = [row for row in multi_rows if row.get('source_scenario') == 'deny']
          cancel = [row for row in multi_rows if row.get('source_scenario') == 'cancel']
          assert len(affirm) == len(deny) == len(cancel) == 40

          for row in affirm:
              assert row['state_after'] == row['state_before'], row
              assert row['fsm_state_before'] == 'ORDER_CONFIRM', row
              assert row['decision'] == 'ORDER_CONFIRMED', row
              assert row['response_key'] == 'ask_next_customer', row
              assert row['fsm_state_after'] == 'WAIT_NEXT_CUSTOMER', row
              assert row['response'] == '주문을 마치시겠어요?', row

          for row in deny:
              assert row['state_after'] == row['state_before'], row
              assert row['fsm_state_before'] == 'ORDER_CONFIRM', row
              assert row['decision'] == 'MODIFY_ORDER', row
              assert row['response_key'] == 'ask_correction_content', row
              assert row['fsm_state_after'] == 'ORDER_CORRECTION', row
              assert row['response'] == '어떤 부분이 다른가요? 메뉴, 온도 또는 수량을 말씀해 주세요.', row

          restart_count = 0
          for row in cancel:
              command = resolver.resolve_command({'text': row['user_text']})
              if command == 'RESTART':
                  restart_count += 1
                  assert row['decision'] == 'REORDER_REQUEST', row
                  assert row['response_key'] == 'restart_order', row
                  assert row['fsm_state_after'] == 'ORDER_LISTEN', row
                  assert row['response'] == '주문을 처음부터 다시 말씀해 주세요.', row
              else:
                  assert row['decision'] == 'CANCEL_ORDER', row
                  assert row['response_key'] == 'cancel_order', row
                  assert row['fsm_state_after'] == 'IDLE', row
                  assert row['response'] == '주문을 취소했어요.', row
          assert restart_count > 0, 'review CANCEL sample should exercise RESTART wording'

          confirm_actions = [row for row in multi_rows if row.get('decision') == 'CONFIRM_ORDER']
          assert confirm_actions, 'expected CONFIRM_ORDER review examples'
          for row in confirm_actions:
              assert row['fsm_state_after'] == 'ORDER_CONFIRM', row

          base_rows = [
              json.loads(line)
              for line in Path('data/tod/pumpkin_tod_v1_base_review_sample.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          assert len(base_rows) == 200, len(base_rows)
          assert all(row.get('review_group') == 'BASE DATA' for row in base_rows)
          assert all(row.get('fsm_state_before') == 'ORDER_LISTEN' for row in base_rows)
          assert all(str(row.get('source_scenario', '')).startswith('BASE DATA · ') for row in base_rows)

          expected_base = {
              'order_complete': 40,
              'order_missing_quantity': 25,
              'order_missing_temperature': 20,
              'order_multi_complete': 35,
              'order_multi_missing_quantity': 25,
              'order_multi_missing_temperature': 25,
              'guide': 15,
              'unknown': 15,
          }
          assert dict(Counter(row['base_scenario'] for row in base_rows)) == expected_base

          combined = [
              json.loads(line)
              for line in Path('data/tod/pumpkin_tod_v1_review_sample.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          assert len(combined) == 400, len(combined)
          assert sum(row.get('review_group') == 'MULTITURN' for row in combined) == 200
          assert sum(row.get('review_group') == 'BASE DATA' for row in combined) == 200
          assert len({row['id'] for row in combined}) == 400

          print(json.dumps({
              'multiturn_review': len(multi_rows),
              'base_review': len(base_rows),
              'combined_review': len(combined),
              'cancel_restart_examples': restart_count,
              'base_scenarios': expected_base,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate review sample and local review server
        run: |
          python3 -m py_compile experiments/tod_slm/review/app.py
          python3 experiments/tod_slm/review/app.py \
            --input data/tod/pumpkin_tod_v1_review_sample.jsonl \
            --check
          grep -q 'ORDER_CONFIRM = FSM 상태' experiments/tod_slm/review/index.html
          grep -q '이번 턴의 시스템 동작' experiments/tod_slm/review/index.html

          REVIEW_TMP="data/tod/.pumpkin_tod_review_ci.jsonl"
          rm -f "$REVIEW_TMP"
          python3 experiments/tod_slm/review/app.py \
            --input data/tod/pumpkin_tod_v1_review_sample.jsonl \
            --no-browser \
            --output "$REVIEW_TMP" \
            --port 8765 > /tmp/pumpkin_review_web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f "$REVIEW_TMP"' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/health > /tmp/review_health.json; then
              break
            fi
            sleep 0.25
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/review_health.json').read_text(encoding='utf-8'))
          assert health == {'ok': True, 'items': 400}, health
          first = json.loads(Path('data/tod/pumpkin_tod_v1_review_sample.jsonl').read_text(encoding='utf-8').splitlines()[0])
          assert first['fsm_state_before']
          assert first['fsm_state_after']
          assert first['response_key']
          Path('/tmp/review_id.txt').write_text(first['id'], encoding='utf-8')
          PY

          SAMPLE_ID=$(cat /tmp/review_id.txt)
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$SAMPLE_ID\",\"verdict\":\"PASS\",\"note\":\"ci\"}" \
            http://127.0.0.1:8765/api/review > /tmp/review_post.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path('/tmp/review_post.json').read_text(encoding='utf-8'))
          assert response['review']['verdict'] == 'PASS', response
          rows = [json.loads(line) for line in Path('data/tod/.pumpkin_tod_review_ci.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows) == 1, rows
          assert rows[0]['verdict'] == 'PASS', rows[0]
          PY

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          rm -f "$REVIEW_TMP"
          trap - EXIT

      - name: Validate distributions and leakage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('data/tod/pumpkin_tod_v1_stats.json').read_text(encoding='utf-8'))
          multi = json.loads(Path('data/tod/pumpkin_tod_v1_multiturn_stats.json').read_text(encoding='utf-8'))
          review = json.loads(Path('data/tod/pumpkin_tod_v1_review_stats.json').read_text(encoding='utf-8'))
          qwen = json.loads(Path('data/tod/qwen/pumpkin_tod_v1_qwen_stats.json').read_text(encoding='utf-8'))

          assert base['total'] == 24019, base['total']
          assert base['supervision_counts']['context_required'] == 3760
          assert multi['train_valid']['base_context_required'] == 3180
          assert multi['train_valid']['generated_multiturn'] == 9540
          assert multi['train_valid']['final_sft_total'] == 28872
          assert multi['train_valid']['final_context_required'] == 0
          assert multi['test']['base_context_required'] == 580
          assert multi['test']['generated_multiturn'] == 580
          assert multi['test']['final_sft_total'] == 1507
          assert multi['test']['final_context_required'] == 0
          assert review['base_data']['source_fully_supervised'] == 19332
          assert review['base_data']['selected_total'] == 200
          assert review['base_data']['test_rows_used_for_human_review'] == 0
          assert review['combined_total'] == 400

          assert qwen['train']['rows'] + qwen['validation']['rows'] == 28872
          assert qwen['test']['rows'] == 1507
          assert qwen['train']['source_groups'] + qwen['validation']['source_groups'] == 22512
          assert qwen['leakage_checks'] == {
              'train_validation_source_group': 0,
              'train_test_source_group': 0,
              'validation_test_source_group': 0,
          }, qwen['leakage_checks']
          assert 0.095 <= qwen['validation_ratio_actual_rows'] <= 0.105

          for path in (
              'data/tod/qwen/pumpkin_tod_v1_train.jsonl',
              'data/tod/qwen/pumpkin_tod_v1_validation.jsonl',
              'data/tod/qwen/pumpkin_tod_v1_test.jsonl',
              'data/tod/qwen/pumpkin_tod_v1_qwen_train.jsonl',
              'data/tod/qwen/pumpkin_tod_v1_qwen_validation.jsonl',
              'data/tod/qwen/pumpkin_tod_v1_qwen_test.jsonl',
          ):
              assert Path(path).exists(), path

          first_chat = json.loads(Path('data/tod/qwen/pumpkin_tod_v1_qwen_train.jsonl').read_text(encoding='utf-8').splitlines()[0])
          assert [m['role'] for m in first_chat['messages']] == ['system', 'user', 'assistant']
          assert isinstance(json.loads(first_chat['messages'][1]['content']), dict)
          assert isinstance(json.loads(first_chat['messages'][2]['content']), dict)

          print(json.dumps({
              'train': qwen['train'],
              'validation': qwen['validation'],
              'test': qwen['test'],
              'leakage_checks': qwen['leakage_checks'],
              'validation_ratio_actual_rows': qwen['validation_ratio_actual_rows'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tod/pumpkin_tod_v1_train_valid.jsonl \
                  data/tod/pumpkin_tod_v1_test.jsonl \
                  data/tod/pumpkin_tod_v1_stats.json \
                  data/tod/pumpkin_tod_v1_multiturn_train_valid.jsonl \
                  data/tod/pumpkin_tod_v1_multiturn_test.jsonl \
                  data/tod/pumpkin_tod_v1_sft_train_valid.jsonl \
                  data/tod/pumpkin_tod_v1_sft_test.jsonl \
                  data/tod/pumpkin_tod_v1_multiturn_review_sample.jsonl \
                  data/tod/pumpkin_tod_v1_base_review_sample.jsonl \
                  data/tod/pumpkin_tod_v1_review_sample.jsonl \
                  data/tod/pumpkin_tod_v1_review_stats.json \
                  data/tod/pumpkin_tod_v1_multiturn_stats.json \
                  data/tod/qwen
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data(tod): regenerate SFT, review, and Qwen splits"
          git push origin HEAD:feat/tod-rule-label-generator
