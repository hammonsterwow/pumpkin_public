name: Refactor syntax check

on:
  push:
    branches:
      - refactor/flatten-runtime-nodes-v2

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python modules
        run: |
          python -m compileall -q ros2_ws/src/robot_controller/robot_controller
          python -m py_compile ros2_ws/src/robot_controller/setup.py
      - name: Check shell syntax
        run: |
          bash -n scripts/run_ros_voice_nodes.sh
          bash -n scripts/run_robot_interaction_demo.sh
          bash -n scripts/run_robot_with_monitor.sh
