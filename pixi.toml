[workspace]
name = "pumpkin-macos"
description = "macOS text-test environment for the Pumpkin ROS2 NLU pipeline"
channels = ["robostack-humble", "conda-forge"]
platforms = ["osx-arm64", "osx-64"]

[dependencies]
python = ">=3.10,<3.13"
ros-humble-ros-base = "*"
colcon-common-extensions = "*"
pip = "*"
# colcon --symlink-install invokes the legacy setuptools develop command.
# setuptools 80+ removed compatible develop options and raises
# "error: option --editable not recognized".
setuptools = ">=65,<80"
pytorch = ">=2.2,<3"
numpy = "<2"
scipy = "<1.14"

[pypi-dependencies]
transformers = "==4.40.2"
huggingface-hub = ">=0.21.2,<1.0"

[tasks]
build-ros = "bash --noprofile --norc -c 'unset PYTHONHOME PYTHONPATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; cd ros2_ws && colcon build --packages-select robot_controller'"
build-ros-clean = "bash --noprofile --norc -c 'unset PYTHONHOME PYTHONPATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; cd ros2_ws && rm -rf build/robot_controller install/robot_controller log && colcon build --packages-select robot_controller'"
run-macos = "bash --noprofile --norc -c 'unset PYTHONHOME PYTHONPATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; exec bash scripts/run_ros_voice_nodes_macos.sh'"
terminal-chat = "bash --noprofile --norc -c 'unset PYTHONHOME PYTHONPATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; source ros2_ws/install/setup.bash && python3 scripts/terminal_chat.py'"
terminal-chat-debug = "bash --noprofile --norc -c 'unset PYTHONHOME PYTHONPATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; source ros2_ws/install/setup.bash && python3 scripts/terminal_chat.py --debug'"
